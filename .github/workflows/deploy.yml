name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT || 22 }}
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            # Pull latest code
            git pull origin main

            # Rebuild and restart containers
            docker compose -f Backend/docker-compose.yml build --no-cache
            docker compose -f Backend/docker-compose.yml up -d

            # Run migrations
            docker compose -f Backend/docker-compose.yml exec -T web python manage.py migrate --noinput

            # Collect static files
            docker compose -f Backend/docker-compose.yml exec -T web python manage.py collectstatic --noinput

            # Remove unused Docker images to free space
            docker image prune -f

            echo "Deployment complete."
