name: Deploy

on:
  push:
    branches: [main]

jobs:
  deploy:
    name: Deploy to Server
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          envs: ENV_FILE
          script: |
            cd ${{ secrets.PROJECT_PATH }}

            # Write the .env file from GitHub secret
            printf '%s' "$ENV_FILE" > Backend/.env

            # Pull latest code
            git pull origin main

            # Build using layer cache (no --no-cache) so unchanged layers are reused.
            # Only layers that actually changed (requirements.txt, source code) rebuild.
            docker-compose -f Backend/docker-compose.yml build

            # Restart containers with zero downtime — up -d replaces only changed services
            docker-compose -f Backend/docker-compose.yml up -d

            # Run any pending migrations
            docker-compose -f Backend/docker-compose.yml exec -T web python manage.py migrate --noinput

            # Collect static files
            docker-compose -f Backend/docker-compose.yml exec -T web python manage.py collectstatic --noinput

            # Prune dangling images only (not all unused — keeps cache layers)
            docker image prune -f

            echo "Deployment complete."
