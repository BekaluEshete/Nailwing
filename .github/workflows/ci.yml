name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  lint-and-check:
    name: Lint & Django Check
    runs-on: ubuntu-latest

    # No Redis service needed — test_settings.py uses InMemoryChannelLayer
    # and LocMemCache so all tests run without a real Redis instance.

    env:
      SECRET_KEY: ci-secret-key-not-for-production
      DEBUG: "True"
      DATABASE_URL: sqlite:///ci-test.db
      REDIS_URL: redis://localhost:6379/0
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      DJANGO_SETTINGS_MODULE: core.test_settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: "pip"
          cache-dependency-path: Backend/requirements.txt

      - name: Install dependencies
        working-directory: Backend
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8

      - name: Lint with flake8
        working-directory: Backend
        run: |
          # Stop if there are syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --exclude=migrations,__pycache__,.venv
          # Warn on style issues (does not fail the build)
          flake8 . --count --max-line-length=120 --statistics --exclude=migrations,__pycache__,.venv --exit-zero

      - name: Run Django system checks
        working-directory: Backend
        run: python manage.py check

      - name: Run Django migrations check
        working-directory: Backend
        run: python manage.py migrate --run-syncdb

      - name: Check for missing migrations
        working-directory: Backend
        run: |
          # Fails if any model change is missing a migration file
          python manage.py makemigrations --check --dry-run

      - name: Run tests
        working-directory: Backend
        run: python manage.py test --settings=core.test_settings --verbosity=2

  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-check

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./Backend
          push: false
          tags: nailwing-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
